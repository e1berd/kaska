name: hardhat

services:
  postgres:
    networks:
      - default
    image: postgres:17-alpine
    container_name: hardhat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-hardhat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    networks:
      - default
    image: axllent/mailpit:latest
    container_name: hardhat-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  rustfs:
    networks:
      - default
    image: rustfs/rustfs:latest
    container_name: hardhat-rustfs
    restart: unless-stopped
    user: "10001:10001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo >/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    networks:
      - default
    build:
      context: ./api
      dockerfile: Dockerfile
    image: hardhat-api:latest
    container_name: hardhat-api
    restart: unless-stopped
    environment:
      MIX_ENV: prod
      PHX_SERVER: "true"
      DATABASE_URL: ecto://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-hardhat}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}
      GUARDIAN_SECRET_KEY: ${GUARDIAN_SECRET_KEY:?}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-noreply@hardhat.local}
      WEB_BASE_URL: ${WEB_BASE_URL:?}
      PHX_HOST: ${PHX_HOST:?}
      PORT: 4000
      S3_BUCKET: ${S3_BUCKET:-hardhat}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://rustfs:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?}
      S3_ACCESS_KEY: ${RUSTFS_ROOT_USER:?}
      S3_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      rustfs:
        condition: service_started

  web:
    networks:
      - default
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_WS_URL: ${VITE_API_WS_URL:?}
    image: hardhat-web:latest
    container_name: hardhat-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"


volumes:
  postgres-data:
  rustfs-data:

networks:
  default:
    name: hardhat-net
