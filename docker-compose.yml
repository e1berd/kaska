name: hardhat

services:
  postgres:
    networks:
      - default
    image: postgres:17-alpine
    container_name: hardhat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-hardhat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    networks:
      - default
    image: rustfs/rustfs:latest
    container_name: hardhat-rustfs
    restart: unless-stopped
    user: "10001:10001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo >/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    networks:
      - default
    build:
      context: ./api
      dockerfile: Dockerfile
    image: hardhat-api:latest
    container_name: hardhat-api
    restart: unless-stopped
    environment:
      MIX_ENV: prod
      PHX_SERVER: "true"
      DATABASE_URL: ecto://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-hardhat}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}
      GUARDIAN_SECRET_KEY: ${GUARDIAN_SECRET_KEY:?}
      MAIL_HOST: ${MAIL_HOST:?}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:?}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-HardHat}
      WEB_BASE_URL: ${WEB_BASE_URL:?}
      PHX_HOST: ${PHX_HOST:?}
      PORT: 4000
      S3_BUCKET: ${S3_BUCKET:-hardhat}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://rustfs:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?}
      S3_ACCESS_KEY: ${RUSTFS_ROOT_USER:?}
      S3_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  web:
    networks:
      - default
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_WS_URL: ${VITE_API_WS_URL:?}
    image: hardhat-web:latest
    container_name: hardhat-web
    restart: "no"
    volumes:
      - web-dist:/export

  caddy:
    networks:
      - default
    image: caddy:2-alpine
    container_name: hardhat-caddy
    restart: unless-stopped
    environment:
      LANDING_DOMAIN: ${LANDING_DOMAIN:?}
      APP_DOMAIN: ${APP_DOMAIN:?}
      S3_DOMAIN: ${S3_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      S3_MAX_UPLOAD_SIZE: ${S3_MAX_UPLOAD_SIZE:-100MB}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - web-dist:/srv/app:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_completed_successfully
      api:
        condition: service_started
      rustfs:
        condition: service_started

volumes:
  postgres-data:
  rustfs-data:
  web-dist:
  caddy-data:
  caddy-config:

networks:
  default:
    name: hardhat-net
