name: hardhat

services:
  postgres:
    image: postgres:17-alpine
    container_name: hardhat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hardhat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hardhat}
      POSTGRES_DB: ${POSTGRES_DB:-hardhat_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: hardhat-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  rustfs:
    image: rustfs/rustfs:latest
    container_name: hardhat-rustfs
    # The image runs as UID 10001 — see https://github.com/rustfs/rustfs.
    # The named volume below has its ownership fixed up automatically.
    user: "10001:10001"
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:-rustfsadmin}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: hardhat-api
    environment:
      MIX_ENV: dev
      POSTGRES_USER: ${POSTGRES_USER:-hardhat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hardhat}
      POSTGRES_DB: ${POSTGRES_DB:-hardhat_dev}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      DATABASE_URL: ecto://${POSTGRES_USER:-hardhat}:${POSTGRES_PASSWORD:-hardhat}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-hardhat_dev}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      GUARDIAN_SECRET_KEY: ${GUARDIAN_SECRET_KEY}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-noreply@hardhat.local}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: 4000
      S3_BUCKET: ${S3_BUCKET:-hardhat}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://rustfs:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${RUSTFS_ROOT_USER:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:-rustfsadmin}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./api:/app
      - api-deps:/app/deps
      - api-build:/app/_build
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      rustfs:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: hardhat-web
    environment:
      # Browser-side WebSocket URL. The browser connects directly to the API
      # port which is published to the host (4000:4000).
      VITE_API_WS_URL: ${VITE_API_WS_URL:-ws://localhost:4000/socket}
      # Tell pnpm we're non-interactive so it doesn't bail on modules-purge prompts.
      CI: "true"
    ports:
      - "${WEB_PORT:-5173}:5173"
    # Bind-mount the host's node_modules so the container reuses packages
    # already installed on the host. Avoids a network fetch on every start.
    volumes:
      - ./web:/app
    depends_on:
      - api

volumes:
  postgres-data:
  api-deps:
  api-build:
  rustfs-data:
